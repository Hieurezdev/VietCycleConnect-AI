services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vietcycle-ai
    ports:
      - "2003:2003"
    env_file:
      - ../.env
    environment:
      - ENV=${ENV:-dev}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
